<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Queijos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #fdfaf6; }
        .admin-header {
            background-color: #4a3728;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .btn-success {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-success:hover { background-color: #1b5e20; }
        
        .btn-danger {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-edit {
            background-color: #f57c00;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .product-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .product-table th, .product-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        .product-table th {
            background-color: #c9a66b;
            color: #4a3728;
        }
        .prod-img-preview {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .modal-header h2 { color: #4a3728; margin: 0; }
        .close-modal {
            background: none; border: none; font-size: 1.5rem; cursor: pointer;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #4a3728; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit;
        }
        .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        
        .header-actions { display: flex; gap: 15px; }
    </style>
</head>
<body>

    <header class="admin-header">
        <div>
            <h2>⚙️ Gestão | <span id="store-title">Carregando...</span></h2>
            <a href="index.html" style="color: #c9a66b; text-decoration: none; font-size: 0.9em;">&larr; Ver Loja</a>
        </div>
        <div class="header-actions">
            <button class="btn-success" onclick="openModal()">+ Novo Produto</button>
            <button class="btn-primary" onclick="saveData()">💾 Salvar Alterações</button>
        </div>
    </header>

    <div class="admin-container">
        <table class="product-table">
            <thead>
                <tr>
                    <th>Imagem</th>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Preço (R$)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <!-- Produtos renderizados via JS -->
            </tbody>
        </table>
    </div>

    <!-- Modal Adicionar/Editar -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Novo Produto</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            
            <input type="hidden" id="prod-id">
            
            <div class="form-group">
                <label>Nome do Produto</label>
                <input type="text" id="prod-name" required>
            </div>
            
            <div class="form-group">
                <label>Categoria</label>
                <select id="prod-category"></select>
            </div>
            
            <div class="form-group">
                <label>Preço (Ex: 35.50)</label>
                <input type="number" step="0.01" id="prod-price" required>
            </div>
            
            <div class="form-group">
                <label>Descrição (opcional)</label>
                <textarea id="prod-desc" rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label>URL da Imagem</label>
                <input type="text" id="prod-image">
            </div>
            
            <div class="form-actions">
                <button class="btn-secondary" onclick="closeModal()" style="border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">Cancelar</button>
                <button class="btn-success" onclick="saveProduct()">Salvar Produto</button>
            </div>
        </div>
    </div>

    <!-- Carrega os dados atuais -->
    <script src="data.js"></script>
    <script src="admin.js"></script>
</body>
</html>
