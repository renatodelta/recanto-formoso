<!DOCTYPE html>
<html lang="pt-BR" class="antialiased text-slate-900 bg-[#fdfaf6]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão | Padaria</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN for admin interface styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        primary: '#4a3728',
                        secondary: '#c9a66b',
                    }
                }
            }
        }
    </script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* Liquid Glass Modal */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.5),
                0 20px 40px -15px rgba(0, 0, 0, 0.05);
        }

        /* Subtle interactions */
        .btn-press {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-press:active {
            transform: translateY(1px) scale(0.98);
        }
        
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .modal-enter { animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col selection:bg-secondary selection:text-primary">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-[#fdfaf6]/80 backdrop-blur-md border-b border-slate-200/50 px-4 py-4 md:px-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex items-center gap-4">
                <a href="index.html" class="p-2 -ml-2 rounded-full hover:bg-slate-100 text-slate-500 transition-colors btn-press">
                    <i class="ph ph-arrow-left text-xl"></i>
                </a>
                <div>
                    <h1 class="text-xl md:text-2xl font-semibold tracking-tight text-primary flex items-center gap-2">
                        <i class="ph ph-storefront"></i>
                        <span id="store-title">Carregando...</span>
                    </h1>
                    <p class="text-sm text-slate-500 font-medium">Painel de Gestão (Local Storage)</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <button onclick="openModal()" class="flex-1 md:flex-none flex items-center justify-center gap-2 bg-primary text-white px-5 py-2.5 rounded-lg font-medium btn-press hover:bg-primary/90">
                    <i class="ph ph-plus-bold"></i>
                    Novo Produto
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-8 md:py-12">
        
        <!-- Status Indicator -->
        <div class="mb-8 flex items-center gap-3 text-sm text-slate-600 bg-white p-4 rounded-xl border border-slate-100 shadow-[0_4px_20px_-10px_rgba(0,0,0,0.05)]">
            <div class="relative flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </div>
            <span>Rodando modo sem servidor (Offline-First). Dados salvos apenas no seu navegador.</span>
        </div>

        <!-- Desktop Table / Mobile List -->
        <div class="bg-white rounded-[2rem] border border-slate-100 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.03)] overflow-hidden">
            <div class="hidden md:grid grid-cols-12 gap-4 p-6 border-b border-slate-100 text-sm font-semibold text-slate-400 uppercase tracking-wider">
                <div class="col-span-1">Img</div>
                <div class="col-span-5">Produto</div>
                <div class="col-span-2">Categoria</div>
                <div class="col-span-2">Preço</div>
                <div class="col-span-2 text-right">Ações</div>
            </div>
            
            <div id="product-list" class="divide-y divide-slate-50">
                <!-- Injected via JS -->
            </div>
            
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 px-4 text-center">
                <div class="w-16 h-16 rounded-2xl bg-slate-50 flex items-center justify-center mb-4 text-slate-300">
                    <i class="ph ph-package text-3xl"></i>
                </div>
                <h3 class="text-lg font-medium text-slate-900 mb-1">Nenhum produto cadastrado</h3>
                <p class="text-slate-500 max-w-[30ch]">Adicione seu primeiro produto para começar a vender online.</p>
            </div>
        </div>
    </main>

    <!-- Modal Base (Hidden by default) -->
    <div id="product-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        
        <div class="relative w-full max-w-lg glass-panel rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[90dvh] modal-enter">
            <div class="px-6 py-5 border-b border-slate-200/50 flex justify-between items-center bg-white/50">
                <h2 id="modal-title" class="text-lg font-semibold text-primary">Novo Produto</h2>
                <button onclick="closeModal()" class="p-2 -mr-2 rounded-full hover:bg-slate-200/50 text-slate-400 transition-colors btn-press">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1 bg-white">
                <input type="hidden" id="prod-id">
                
                <div class="space-y-5">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-medium text-slate-700">Nome do Produto</label>
                        <input type="text" id="prod-name" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" placeholder="Ex: Bolo de Laranja">
                    </div>
                    
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-medium text-slate-700">Categoria</label>
                        <div class="relative">
                            <select id="prod-category" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all appearance-none bg-white">
                            </select>
                            <i class="ph ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-medium text-slate-700">Preço (R$)</label>
                        <input type="number" step="0.01" id="prod-price" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all font-mono" placeholder="0.00">
                    </div>
                    
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-medium text-slate-700">Descrição <span class="text-slate-400 font-normal">(Opcional)</span></label>
                        <textarea id="prod-desc" rows="2" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all resize-none" placeholder="Detalhes do produto..."></textarea>
                    </div>
                    
                    <div class="flex flex-col gap-1.5">
                        <label class="text-sm font-medium text-slate-700">URL da Imagem <span class="text-slate-400 font-normal">(Opcional)</span></label>
                        <input type="text" id="prod-image" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" placeholder="https://...">
                    </div>
                </div>
            </div>
            
            <div class="px-6 py-5 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl font-medium text-slate-600 hover:bg-slate-200/50 transition-colors btn-press">
                    Cancelar
                </button>
                <button onclick="saveProduct()" class="px-5 py-2.5 rounded-xl font-medium bg-primary text-white hover:bg-primary/90 transition-colors btn-press flex items-center gap-2">
                    <i class="ph ph-check-circle"></i>
                    Salvar
                </button>
            </div>
        </div>
    </div>

    <!-- Load defaults from data.js -->
    <script src="data.js"></script>
    <script src="admin.js"></script>
</body>
</html>
